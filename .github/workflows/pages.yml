name: 发布文档网页

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "rules/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 合并文档与规则镜像
        run: |
          mkdir -p public
          cp -a docs/. public/
          cp -a rules public/rules
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
