services:
  cmsingbox:
    build: .
    image: cmsingbox:local
    container_name: cmsingbox
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Asia/Shanghai
      CMSINGBOX_LICENSE_PUBLIC_KEY: ${CMSINGBOX_LICENSE_PUBLIC_KEY:-tmySfFXNcgxWTfs5MLotrluSbEza8oDx9tSBkXoA4Dw=}
    volumes:
      - ./data:/data
    networks:
      cmsingbox_lan:
        ipv4_address: ${CMSINGBOX_IP:?请设置 CMSINGBOX_IP}

networks:
  cmsingbox_lan:
    external: true
    name: ${CMSINGBOX_DOCKER_NETWORK:?请设置 CMSINGBOX_DOCKER_NETWORK}
