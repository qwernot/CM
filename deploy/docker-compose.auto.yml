services:
  cmsingbox:
    image: ${CMSINGBOX_IMAGE:-darkver8/cmsingbox:latest}
    container_name: cmsingbox
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    networks:
      cmsingbox_egress:
        gw_priority: 1
      cmsingbox_lan:
        gw_priority: 0
        ipv4_address: ${CMSINGBOX_IP:?请设置 CMSINGBOX_IP}

networks:
  cmsingbox_egress:
    driver: bridge
  cmsingbox_lan:
    external: true
    name: ${CMSINGBOX_DOCKER_NETWORK:?请设置 CMSINGBOX_DOCKER_NETWORK}
