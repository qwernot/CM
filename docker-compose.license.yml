services:
  cmsingbox-license:
    build:
      context: .
      dockerfile: Dockerfile.license
    image: cmsingbox-license:local
    container_name: cmsingbox-license
    restart: unless-stopped
    ports:
      - "${CMSINGBOX_LICENSE_PORT:-9093}:9093"
    environment:
      TZ: Asia/Shanghai
      CMSINGBOX_LICENSE_PASSWORD_HASH: ${CMSINGBOX_LICENSE_PASSWORD_HASH:?缺少授权端密码摘要}
    volumes:
      - ./license-data:/license

